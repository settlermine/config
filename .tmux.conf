setw -g mode-keys vi

set -g mouse on
set -g allow-passthrough on

# OSC52 clipboard settings
set -s set-clipboard on
set -g get-clipboard both
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:clipboard'

set -s escape-time 0

set -g history-limit 2000

bind -n M-R source-file ~/.tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

# Window management
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Enter new-window
bind -n M-q kill-window
bind -n M-H previous-window
bind -n M-L next-window
bind -n 'M-[' swap-window -t -1
bind -n 'M-]' swap-window -t +1
bind -n M-r command-prompt -p "Window name:" "rename-window '%%'"

# Pane management
bind -n M-l select-pane -L
bind -n M-h select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Down resize-pane -U 3
bind -n M-Up resize-pane -D 3
# Zoom current pane
bind -n M-z resize-pane -Z
# Swap panes
bind -n 'M-<' swap-pane -U
bind -n 'M->' swap-pane -D

bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"

bind -n M-c kill-pane
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

bind -n M-y copy-mode

bind -n M-p display-popup -d "#{pane_current_path}"

# Style
set -g status-interval 1

set -g status-position top
set -g status-left-length 100
set -g status-left "#[fg=colour15,bold] {#S} | "
set -g status-right '#[fg=coluur15]CPU #(LC_ALL=C top -bn1 | awk "/Cpu\(s\)/ {printf \"%.0f%%\", 100-\$8; exit}")  MEM #(free | awk "/Mem:/ {printf \"%.0f%%\", \$3/\$2*100}")  %H:%M'
set -g status-style "fg=colour15, bg=default"

set -g window-status-current-format "#[fg=colour14,bold] [#W-#I]"
set -g window-status-format "#[fg=colour15] [#W-#I]"

set -g pane-active-border-style "fg=color7"
set -g pane-border-style "fg=color15"

